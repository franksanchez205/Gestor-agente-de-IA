services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: puente
      POSTGRES_PASSWORD: puente
      POSTGRES_DB: puente
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
    volumes:
      - .:/app

volumes:
  pgdata: